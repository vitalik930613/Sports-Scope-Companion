name: sports_scope_companion
description: Enregistrement de capteurs vélo (Di2, puissance, cadence, cardio, GPS) et navigation.
publish_to: none
# Le `+N` est le versionCode Android. Sans lui, Flutter retombe sur 1 : deux APK
# différents porteraient le même numéro, et le second refuserait de s'installer
# par-dessus le premier. À incrémenter à chaque fichier diffusé.
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # BLE. L'API de flutter_blue_plus bouge d'une mineure à l'autre :
  # épinglée volontairement.
  flutter_blue_plus: ^1.35.0

  # Persistance des sorties : un fichier JSONL par session, écrit en ajout au
  # fil de l'enregistrement (voir lib/recording/ride_store.dart). Pas de base de
  # données — l'écriture est séquentielle et ne se relit qu'à l'export.
  path_provider: ^2.1.4
  path: ^1.9.0
  webview_flutter: ^4.14.1
  app_links: ^7.2.1
  permission_handler: ^12.0.3
  webview_flutter_android: ^4.13.0

  # Position pendant l'enregistrement, service au premier plan compris
  # (`AndroidSettings.foregroundNotificationConfig`).
  geolocator: ^14.0.3

  # Export : le .fit part par le menu de partage d'Android.
  share_plus: ^13.3.0

  # Les alertes sonores du radar arrière, déclarées en guidage de navigation :
  # elles sortent au volume multimédia — le seul qu'un cycliste monte — et font
  # baisser la musique le temps du bip au lieu de la couper. Les tonalités sont
  # générées par `tool/radar_tones.dart`.
  audioplayers: ^6.1.0
  # Le versionCode qui tourne réellement, pour le comparer à celui que publie le
  # site (lib/update/). Le lire à l'exécution plutôt que de recopier le pubspec
  # dans une constante Dart : deux sources pour le même numéro finissent toujours
  # par diverger, et celle qui ment ici ne propose plus jamais de mise à jour.
  package_info_plus: ^10.2.1

  # Ouvre la page de téléchargement dans Chrome. Pas dans un WebView de l'appli :
  # `webview_flutter` ne gère pas les téléchargements, et c'est de toute façon au
  # navigateur qu'Android confie l'installation d'un APK.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
